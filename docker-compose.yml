services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: pena-vermelha:dev
    ports:
      - "3000:3000"
    # .env.local manda no WhatsApp/Supabase (não sobrescrever com default aqui)
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    restart: unless-stopped

  # Produção: docker compose --profile prod up --build app-prod
  app-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    image: pena-vermelha:prod
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    restart: unless-stopped

volumes:
  app_node_modules:
